<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Expenses</title>
  <meta name="description" content="Track your monthly expenses. Works offline, data stays on your device.">
  <meta name="theme-color" content="#f6f6f3">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme and language direction before first paint to avoid a flash.
    try {
      var t = localStorage.getItem('expenses:theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      var l = localStorage.getItem('expenses:lang');
      if (l === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="view" class="view" tabindex="-1">
    <div class="boot"><div class="spinner" aria-label="Loading"></div></div>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/home" data-tab="home"><span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg></span><span data-i18n="tab.home">Home</span></a>
    <a href="#/list" data-tab="list"><span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></span><span data-i18n="tab.list">Expenses</span></a>
    <a href="#/reports" data-tab="reports"><span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span><span data-i18n="tab.reports">Reports</span></a>
    <a href="#/categories" data-tab="categories"><span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg></span><span data-i18n="tab.categories">Categories</span></a>
    <a href="#/settings" data-tab="settings"><span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></span><span data-i18n="tab.settings">Settings</span></a>
  </nav>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px">Expenses needs JavaScript enabled.</p></noscript>
</body>
</html>
